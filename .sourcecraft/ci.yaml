on:
  pull_request:
    - workflows: [pr-check]

  push:
    - workflows: [pr-check]
      filter:
        branches: ["main"]

workflows:
  pr-check:
    checkout:
      fetch_depth: 0
    settings:
      max_cube_duration: 35m
    tasks:
      - name: foundation-verify
        cubes:
          - name: install-and-check
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - corepack enable
              - corepack prepare pnpm@11.5.1 --activate
              - node scripts/verify-release-runtime.mjs
              - pnpm install --frozen-lockfile
              - pnpm verify:snapshots
              - pnpm verify:fast
              - pnpm build

  merge-fast:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Reviewed PR head SHA"
    checkout:
      fetch_depth: 0
    settings:
      max_cube_duration: 45m
    tasks:
      - name: exact-head-fast-gate
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        cubes:
          - name: verify
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - corepack enable
              - corepack prepare pnpm@11.5.1 --activate
              - node scripts/verify-release-runtime.mjs
              - pnpm install --frozen-lockfile
              - node scripts/ci/verify-exact-head.mjs
              - pnpm verify:snapshots
              - pnpm verify:fast
              - pnpm build

  merge-heavy:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Full reviewed PR head SHA"
    checkout:
      fetch_depth: 0
    settings:
      max_cube_duration: 90m
    tasks:
      - name: exact-head-heavy-gate
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          TEST_DATABASE_HOST: 127.0.0.1
          TEST_DATABASE_PORT: "5432"
          TEST_DATABASE_USER: seo_monitor_test
          TEST_DATABASE_PASSWORD: seo_monitor_test
          TEST_DATABASE_NAME: seo_monitor_ci_test
          TEST_DATABASE_SSLMODE: disable
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production-1234567890
          BETTER_AUTH_URL: http://127.0.0.1:3100
        cubes:
          - name: verify
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - corepack enable
              - corepack prepare pnpm@11.5.1 --activate
              - node scripts/verify-release-runtime.mjs
              - pnpm install --frozen-lockfile
              - bash scripts/ci/prepare-heavy-environment.sh
              - node scripts/ci/verify-exact-head.mjs
              - pnpm verify:heavy
