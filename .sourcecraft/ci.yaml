on:
  pull_request:
    - workflows: [pr-check]
      filter:
        target_branches: ["main"]

  push:
    - workflows: [pr-check]
      filter:
        branches: ["main"]

workflows:
  pr-check:
    checkout:
      fetch_depth: 0
    settings:
      max_cube_duration: 35m
    tasks:
      - name: foundation-verify
        cubes:
          - name: install-and-check
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - corepack enable
              - corepack prepare pnpm@11.5.1 --activate
              - node scripts/verify-release-runtime.mjs
              - pnpm install --frozen-lockfile
              - pnpm verify:snapshots
              - pnpm verify:fast
              - pnpm build

  merge-heavy:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Full reviewed PR head SHA"
    checkout:
      fetch_depth: 0
    settings:
      max_cube_duration: 45m
    tasks:
      - name: exact-head-heavy-gate
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        cubes:
          - name: verify
            devcontainer:
              workspace_folder: "./.devcontainer/ci"
            script:
              - corepack enable
              - corepack prepare pnpm@11.5.1 --activate
              - node scripts/verify-release-runtime.mjs
              - pnpm install --frozen-lockfile
              - node scripts/ci/verify-exact-head.mjs
              - pnpm verify:snapshots
              - pnpm verify:fast
              - bash scripts/ci/run-postgres-integration.sh
              - pnpm build:collector
              - pnpm build
              - pnpm exec playwright install --with-deps chromium
              - pnpm test:e2e:run
