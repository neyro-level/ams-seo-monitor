services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-seo_monitor_local}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: postgres
      TEST_DATABASE_USER: ${TEST_DATABASE_USER:-seo_monitor_test}
      TEST_DATABASE_PASSWORD: ${TEST_DATABASE_PASSWORD:?Set TEST_DATABASE_PASSWORD in .env.local}
      TEST_DATABASE_NAME: ${TEST_DATABASE_NAME:-seo_monitor_test}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - seo-monitor-postgres-data:/var/lib/postgresql
      - ./ops/local/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  seo-monitor-postgres-data:
