server {
    listen 80;
    listen [::]:80;
    server_name seo-monitor.ams24.ru;

    root /opt/ams-platform/ams-seo-monitor/current/out;
    index index.html;

    access_log /var/log/nginx/ams-seo-monitor.access.log;
    error_log /var/log/nginx/ams-seo-monitor.error.log;

    location = / {
        auth_basic "AMS SEO Monitor";
        auth_basic_user_file /etc/ams-platform/ams-seo-monitor-auth/analyst.htpasswd;
        try_files /index.html =404;
    }

    location ^~ /analyst/ {
        auth_basic "AMS SEO Monitor — analyst";
        auth_basic_user_file /etc/ams-platform/ams-seo-monitor-auth/analyst.htpasswd;
        try_files $uri $uri/ =404;
    }

    location ^~ /demo/ {
        auth_basic "AMS SEO Monitor — analyst";
        auth_basic_user_file /etc/ams-platform/ams-seo-monitor-auth/analyst.htpasswd;
        try_files $uri $uri/ =404;
    }

    location ^~ /c/REDACTED_CLIENT_DATA/data/ {
        auth_basic "AMS SEO Monitor — REDACTED_CLIENT_DATA";
        auth_basic_user_file /etc/ams-platform/ams-seo-monitor-auth/REDACTED_CLIENT_DATA.htpasswd;
        alias /opt/ams-platform/ams-seo-monitor/shared/client-reports/REDACTED_CLIENT_DATA/;
        add_header Cache-Control "private, no-store" always;
    }

    location ^~ /c/REDACTED_CLIENT_DATA/ {
        auth_basic "AMS SEO Monitor — REDACTED_CLIENT_DATA";
        auth_basic_user_file /etc/ams-platform/ams-seo-monitor-auth/REDACTED_CLIENT_DATA.htpasswd;
        try_files $uri $uri/ =404;
    }

    location ^~ /c/REDACTED_CLIENT_DATA/ {
        auth_basic "AMS SEO Monitor — analyst";
        auth_basic_user_file /etc/ams-platform/ams-seo-monitor-auth/analyst.htpasswd;
        try_files $uri $uri/ =404;
    }

    location ^~ /_next/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
