server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seo-monitor.ams24.ru;

    ssl_certificate /etc/letsencrypt/live/seo-monitor.ams24.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seo-monitor.ams24.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ams-seo-monitor.access.log;
    error_log /var/log/nginx/ams-seo-monitor.error.log;
    autoindex off;
    client_max_body_size 2m;

    location ^~ /_next/static/ {
        alias /opt/ams-platform/ams-seo-monitor/current/.next/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        alias /opt/ams-platform/ams-seo-monitor/current/public/fonts/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 300;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name seo-monitor.ams24.ru;
    return 301 https://$host$request_uri;
}
